<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>績溪微光：母親的教誨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="胡適〈母親的教誨〉國文解謎 3D 遊戲，可投影或用平板操作。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D ink diorama behind everything; a thin HUD band on top, the dialogue scroll docked at the bottom,
   and 思維殿堂 puzzles floating in the middle while the scene slows and drains to ink. One dark visual world, no light theme. */
:root{
  --night:#0f1116;      /* 夜墨：頁面底色 */
  --panel:#161a21;      /* 墨色面板 */
  --panel-2:#1f242d;
  --wall:#ecebe6;       /* 粉牆白：主要文字 */
  --mist:#a9afb8;       /* 霧灰：次要文字 */
  --lamp:#f0b35a;       /* 油燈琥珀：重點 */
  --gold:#e8cf90;       /* 思維殿堂金字 */
  --seal:#d0503f;       /* 印泥朱：錯誤、印章 */
  --celadon:#86c0a5;    /* 青瓷：正確 */
  --line:rgba(232,207,144,.32);
  --line-soft:rgba(236,235,230,.14);
  --shade:rgba(10,12,16,.86);
  --font-display:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --font-body:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:1;
  --t-small:calc(var(--fs) * clamp(13px, 11px + .45vw, 19px));
  --t-ui:calc(var(--fs) * clamp(15px, 12px + .65vw, 23px));
  --t-dialog:calc(var(--fs) * clamp(19px, 13px + 1.25vw, 37px));
  --t-prompt:calc(var(--fs) * clamp(20px, 13px + 1.35vw, 40px));
  --t-option:calc(var(--fs) * clamp(17px, 12px + 1vw, 32px));
  --t-hero:clamp(46px, 30px + 5.2vw, 120px);
  --r:6px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--wall);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;background:var(--night);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter .9s ease}
#stage.palace{filter:grayscale(.88) contrast(1.12) brightness(.62)}
#stage.cold{filter:saturate(.35) hue-rotate(160deg) brightness(.85)}
#stage.veil{filter:blur(7px) brightness(1.08) saturate(.6)}
#stage.ink{filter:grayscale(1) contrast(1.25) brightness(1.05)}
#fallback{position:absolute;inset:0;display:none;background:
  radial-gradient(120% 70% at 50% 110%, #2a2f38 0%, transparent 60%),
  linear-gradient(180deg,#1a1e26 0%,#0f1116 70%)}
#fallback.on{display:block}
#fallback svg{position:absolute;inset:auto 0 0 0;width:100%;height:55%;opacity:.55}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(6,7,10,.72) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease;background:radial-gradient(circle at 50% 50%,rgba(236,235,230,.0) 0%,rgba(236,235,230,.55) 55%,rgba(236,235,230,.85) 100%)}
#veil.on{opacity:1}
#frost{position:absolute;inset:0;pointer-events:none;opacity:0}
#frost.on{animation:frost 1.8s ease-out forwards}
#frost svg{width:100%;height:100%}
@keyframes frost{0%{opacity:0}8%{opacity:1;background:rgba(200,225,255,.35)}100%{opacity:.0;background:transparent}}
#fade{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:60}
#fade.on{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none;z-index:5}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-ui);font-size:var(--t-small);color:var(--wall);background:rgba(15,17,22,.78);border:1px solid var(--line);padding:.25em .6em;border-radius:3px;white-space:nowrap;transition:background .4s,color .4s,border-color .4s}
.lbl.hot{background:var(--lamp);color:#1b1408;border-color:var(--lamp)}

/* UI layer with the side gutter */
#ui{position:absolute;inset:0;z-index:10;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px;display:flex;flex-direction:column;pointer-events:none}
#ui > *{pointer-events:auto}
#ui > [hidden]{display:none!important}
.btn{font-family:var(--font-ui);font-size:var(--t-ui);font-weight:500;color:var(--wall);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);min-height:52px;padding:.45em 1.1em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:background .2s,border-color .2s,transform .1s;letter-spacing:.04em}
.btn:hover{background:#29303b;border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.chip:focus-visible,.tile:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.primary{background:var(--lamp);color:#1d1408;border-color:var(--lamp);font-weight:700}
.btn.primary:hover{background:#f6c477}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn{min-width:52px;padding:.3em .7em}
.icon-btn svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* HUD */
#hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hud-chapter{display:flex;align-items:baseline;gap:.6em;min-width:0;background:var(--shade);border:1px solid var(--line-soft);padding:.35em .8em;border-radius:var(--r)}
.hud-chapter b{font-family:var(--font-display);font-size:var(--t-ui);color:var(--gold);font-weight:700;white-space:nowrap}
.hud-chapter span{font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-face{display:flex;align-items:center;gap:.5em;background:var(--shade);border:1px solid var(--line-soft);padding:.35em .8em;border-radius:var(--r);font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist)}
.flames{display:flex;gap:.25em}
.flame{width:1.05em;height:1.45em;display:block}
.flame path{fill:var(--lamp);transition:fill .4s,opacity .4s}
.flame.out path{fill:#3a3f48}
.flame.lost{animation:snuff .6s ease}
@keyframes snuff{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.hud-tools{display:flex;gap:8px}
#hud .practice-tag{font-family:var(--font-ui);font-size:var(--t-small);color:var(--celadon);border:1px solid var(--celadon);border-radius:3px;padding:.1em .45em}

/* generic overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px}
.overlay[hidden]{display:none!important}
.scrim{background:radial-gradient(ellipse at 50% 40%,rgba(15,17,22,.55),rgba(8,9,12,.92))}

/* Title screen */
#title{gap:clamp(20px,5vw,90px);flex-wrap:wrap;background:linear-gradient(90deg,rgba(8,9,12,.82) 0%,rgba(8,9,12,.35) 55%,rgba(8,9,12,.1) 100%);justify-content:flex-start}
.scroll-title{margin:0;align-self:center;writing-mode:vertical-rl;font-family:var(--font-display);font-size:var(--t-hero);line-height:1.15;color:var(--wall);font-weight:700;letter-spacing:.12em;text-shadow:0 0 30px rgba(240,179,90,.25);margin-inline-start:clamp(0px,4vw,80px)}
.scroll-title small{display:block;font-size:.36em;color:var(--gold);letter-spacing:.3em;font-weight:400;margin-top:3.2em}
.title-side{display:flex;flex-direction:column;gap:14px;max-width:min(520px,100%);min-width:0}
.title-side p{font-size:var(--t-ui);line-height:1.75;color:var(--mist);margin:0 0 8px;text-wrap:pretty}
.title-side .btn{width:100%;justify-content:flex-start}
.title-side .row{display:flex;gap:10px;flex-wrap:wrap}
.title-side .row .btn{flex:1 1 180px;width:auto;justify-content:center}
.lesson-tag{font-family:var(--font-ui);font-size:var(--t-small);letter-spacing:.2em;color:var(--gold)}
.toggle-line{display:flex;align-items:center;gap:.7em;font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist);cursor:pointer;min-height:44px}
.toggle-line input{width:1.4em;height:1.4em;accent-color:var(--lamp)}

/* Chapter select */
.sheet{width:min(1040px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.5vw,36px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet h2{font-family:var(--font-display);font-size:var(--t-prompt);margin:0 0 .2em;color:var(--gold);text-wrap:balance}
.sheet .sub{font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist);margin:0 0 1em}
.chap-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.chap-item{display:flex;flex-direction:column;align-items:flex-start;gap:.3em;text-align:left;padding:1em 1.1em;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r);color:var(--wall);cursor:pointer;font-family:var(--font-body);min-height:120px}
.chap-item:hover{border-color:var(--gold)}
.chap-item .no{font-family:var(--font-ui);font-size:var(--t-small);color:var(--gold);letter-spacing:.15em}
.chap-item .nm{font-family:var(--font-display);font-size:var(--t-option);font-weight:700}
.chap-item .ds{font-size:var(--t-small);color:var(--mist);line-height:1.6}
.chap-item.ext{border-style:dashed}
.chap-item .done{font-family:var(--font-ui);font-size:var(--t-small);color:var(--celadon)}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:1.2em;flex-wrap:wrap}
.group-label{font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist);letter-spacing:.2em;margin:1.2em 0 .6em}

/* Chapter card */
#card{background:radial-gradient(ellipse at 30% 50%,rgba(15,17,22,.35),rgba(8,9,12,.9));cursor:pointer}
.card-inner{display:flex;align-items:center;gap:clamp(16px,4vw,64px);max-width:1100px;flex-wrap:wrap;justify-content:center}
.card-no{writing-mode:vertical-rl;font-family:var(--font-display);font-size:clamp(40px,24px + 4vw,96px);color:var(--gold);letter-spacing:.2em;font-weight:700}
.card-body{display:flex;flex-direction:column;gap:12px;max-width:640px;min-width:0}
.card-body h2{font-family:var(--font-display);font-size:clamp(34px,20px + 3.6vw,84px);margin:0;line-height:1.15;text-wrap:balance}
.card-body .para{font-family:var(--font-ui);font-size:var(--t-ui);color:var(--lamp);letter-spacing:.15em}
.card-body .points{display:flex;flex-wrap:wrap;gap:8px}
.card-body .points span{font-family:var(--font-ui);font-size:var(--t-small);border:1px solid var(--line);color:var(--gold);padding:.2em .7em;border-radius:3px}
.card-body .note{font-size:var(--t-small);color:var(--mist);line-height:1.7}
.card-body .btn{align-self:flex-start;margin-top:8px}

/* Dialogue */
#tapzone{position:absolute;inset:0;z-index:9}
#dialogue{margin-top:auto;align-self:center;width:min(1180px,100%);background:linear-gradient(180deg,rgba(18,21,27,.93),rgba(12,14,19,.96));border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,1.6vw,26px) clamp(16px,2.2vw,34px) clamp(14px,1.6vw,24px);position:relative;cursor:pointer;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#dialogue .who{position:absolute;top:0;left:clamp(14px,2vw,30px);transform:translateY(-55%);font-family:var(--font-display);font-size:var(--t-ui);font-weight:700;color:#1d1408;background:var(--gold);padding:.15em .8em;border-radius:3px;letter-spacing:.12em}
#dialogue .who.narr{background:var(--panel-2);color:var(--mist);border:1px solid var(--line)}
#dialogue .who.son{background:var(--celadon);color:#0f1a14}
#dialogue .who.other{background:#c9c3b6;color:#1a1814}
#dialogue .line{font-family:var(--font-display);font-size:var(--t-dialog);line-height:1.7;margin:.35em 0 0;min-height:3.4em;text-wrap:pretty;max-width:46em}
#dialogue .line.quote{color:var(--gold)}
#dialogue .hint{position:absolute;right:clamp(14px,2vw,28px);bottom:clamp(8px,1vw,14px);font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist);display:flex;align-items:center;gap:.4em}
#dialogue .hint i{width:0;height:0;border-left:.42em solid transparent;border-right:.42em solid transparent;border-top:.55em solid var(--gold);animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(.25em)}}

/* 思維殿堂 puzzle panel */
#palace{align-items:center;justify-content:center}
.palace-card{width:min(1120px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(14,16,21,.95),rgba(10,11,15,.97));border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.2vw,36px);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 80px rgba(232,207,144,.10),0 30px 80px rgba(0,0,0,.55);animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.palace-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:.6em}
.palace-head .ttl{font-family:var(--font-display);color:var(--gold);font-size:var(--t-ui);letter-spacing:.3em}
.palace-head .tag{font-family:var(--font-ui);font-size:var(--t-small);color:var(--night);background:var(--gold);padding:.12em .6em;border-radius:3px}
.palace-head .tag.ext{background:transparent;color:var(--mist);border:1px dashed var(--mist)}
.palace-head .timer{margin-left:auto;font-family:var(--font-ui);font-variant-numeric:tabular-nums;font-size:var(--t-ui);color:var(--lamp)}
.prompt{font-family:var(--font-display);font-size:var(--t-prompt);line-height:1.5;margin:.1em 0 .5em;text-wrap:balance}
.quote{font-family:var(--font-display);font-size:var(--t-option);line-height:1.7;color:var(--gold);margin:0 0 .9em;padding:.5em .9em;background:rgba(232,207,144,.07);border:1px solid rgba(232,207,144,.18);border-radius:var(--r)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{display:flex;align-items:center;gap:.8em;text-align:left;font-family:var(--font-body);font-size:var(--t-option);line-height:1.45;color:var(--wall);background:linear-gradient(180deg,rgba(232,207,144,.10),rgba(232,207,144,.03));border:1px solid var(--line);border-radius:var(--r);padding:.65em .9em;min-height:64px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:var(--gold);background:rgba(232,207,144,.14)}
.opt .k{flex:none;width:1.9em;height:1.9em;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);border-radius:50%;font-family:var(--font-ui);font-size:.8em;font-weight:700}
.opt .zy{font-family:var(--font-ui);letter-spacing:.08em}
.opt.correct{border-color:var(--celadon);background:rgba(134,192,165,.16)}
.opt.correct .k{background:var(--celadon);border-color:var(--celadon);color:#0f1a14}
.opt.wrong{border-color:var(--seal);background:rgba(208,80,63,.12);opacity:.65;cursor:not-allowed;animation:shake .4s}
.opt.wrong .k{border-color:var(--seal);color:var(--seal)}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{margin-top:1em;padding:.9em 1.1em;border-radius:var(--r);border:1px solid var(--line-soft);background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:.5em}
.feedback[hidden]{display:none}
.feedback .fb-h{font-family:var(--font-ui);font-size:var(--t-small);letter-spacing:.2em;font-weight:700}
.feedback.ok .fb-h{color:var(--celadon)}
.feedback.no .fb-h{color:var(--seal)}
.feedback p{margin:0;font-size:var(--t-option);line-height:1.65;text-wrap:pretty}
.feedback .branch{font-family:var(--font-display);color:var(--mist);font-size:var(--t-ui)}
.feedback .skill{font-family:var(--font-display);color:var(--lamp);font-size:var(--t-ui)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:1em;flex-wrap:wrap}

/* order */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.card{position:relative;text-align:left;font-family:var(--font-body);font-size:var(--t-option);line-height:1.45;color:var(--wall);background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:.6em .8em .6em 2.8em;min-height:64px;cursor:pointer}
.card .num{position:absolute;left:.6em;top:50%;transform:translateY(-50%);width:1.7em;height:1.7em;border-radius:50%;border:1px dashed var(--mist);display:grid;place-items:center;font-family:var(--font-ui);font-size:.8em;color:var(--mist)}
.card.on{border-color:var(--gold);background:rgba(232,207,144,.10)}
.card.on .num{border:1px solid var(--gold);background:var(--gold);color:#1d1408;font-weight:700}
.card.good{border-color:var(--celadon)}
.card.good .num{background:var(--celadon);border-color:var(--celadon)}
.card.bad{border-color:var(--seal);animation:shake .4s}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px;align-items:start}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.match .col-h{font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist);letter-spacing:.15em}
.match .card{padding-left:.9em}
.match .card .pair{float:right;margin-left:.5em;font-family:var(--font-ui);font-size:.75em;color:#0f1a14;background:var(--celadon);border-radius:3px;padding:0 .45em}
.match .card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,207,144,.35) inset}
.match .card.done{border-color:var(--celadon);background:rgba(134,192,165,.12);cursor:default}
.boss{display:flex;align-items:center;gap:.7em;margin:0 0 .9em;font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist)}
.boss .bar{flex:1;height:12px;border-radius:6px;background:#2a2f38;overflow:hidden;border:1px solid var(--line-soft)}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--seal),#e0805f);transition:width .5s ease}

/* sort */
.sort-list{display:flex;flex-direction:column;gap:10px}
.sort-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:.5em .8em}
.sort-row .txt{font-size:var(--t-option);line-height:1.45;min-width:0;flex:1 1 220px}
.sort-row.bad{border-color:var(--seal);animation:shake .4s}
.sort-row.good{border-color:var(--celadon)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--font-ui);font-size:var(--t-ui);color:var(--wall);background:transparent;border:1px solid var(--line);border-radius:999px;min-height:48px;padding:.2em 1em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:#1d1408;border-color:var(--gold);font-weight:700}

/* fill */
.phrases{display:flex;flex-direction:column;gap:.7em;margin-bottom:1em}
.phrase{font-family:var(--font-display);font-size:var(--t-option);line-height:2}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:4.2em;min-height:1.8em;margin:0 .25em;padding:0 .4em;border:none;border-bottom:2px solid var(--gold);background:rgba(232,207,144,.08);color:var(--gold);font-family:var(--font-display);font-size:1em;cursor:pointer;vertical-align:middle;border-radius:3px 3px 0 0}
.slot.good{border-color:var(--celadon);color:var(--celadon)}
.slot.bad{border-color:var(--seal);color:var(--seal)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tile{font-family:var(--font-display);font-size:var(--t-option);color:var(--wall);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);min-height:56px;padding:.2em 1em;cursor:pointer}
.tile[disabled]{opacity:.25;cursor:default}

/* QTE */
.qte{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.6em 1.4em}
.qte-info{display:flex;flex-direction:column;gap:.7em;min-width:0}
.qte .prompt{margin:0}
@media (max-width:640px){.qte{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.qte .meter{width:100%;height:18px;border-radius:9px;background:#2a2f38;border:1px solid var(--line-soft);overflow:hidden;position:relative}
.qte .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--celadon),#b9e0cc)}
.qte .meter.cry i{background:linear-gradient(90deg,#c9a24f,var(--seal))}
.qte .meter .redline{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--seal);left:85%}
.qte .big{width:clamp(112px,15vw,190px);height:clamp(112px,15vw,190px);border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 40%,rgba(240,179,90,.35),rgba(22,26,33,.95));color:var(--wall);font-family:var(--font-display);font-size:var(--t-option);cursor:pointer;touch-action:none;transition:transform .1s}
.qte .big.down{transform:scale(.94);background:radial-gradient(circle at 50% 40%,rgba(240,179,90,.6),rgba(22,26,33,.95))}
.eye{display:flex;align-items:center;gap:.6em;font-family:var(--font-display);font-size:var(--t-ui);color:var(--mist);min-height:2.4em}
.eye svg{width:3.2em;height:2em}
.eye svg path,.eye svg circle{fill:none;stroke:currentColor;stroke-width:2}
.eye.warn{color:var(--lamp)}
.eye.on{color:var(--seal)}
.eye.on svg circle{fill:var(--seal)}
.qte .status{font-family:var(--font-display);font-size:var(--t-ui);min-height:1.6em;color:var(--gold)}
.qte.flash{animation:redflash .5s}
@keyframes redflash{0%{box-shadow:0 0 0 0 rgba(208,80,63,.0)}30%{box-shadow:0 0 0 999px rgba(208,80,63,.18) inset}100%{box-shadow:none}}

#palace.dock{align-items:flex-end}
#palace.dock .palace-card{max-height:58%;width:min(980px,100%)}
#palace.dock .opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
/* listen plan */
.cue{font-family:var(--font-display);font-size:var(--t-option);color:var(--lamp);min-height:1.7em;margin:.2em 0 .6em}

/* results / bad end */
.result{display:flex;gap:clamp(18px,4vw,60px);align-items:center;flex-wrap:wrap;justify-content:center}
.seal{flex:none;width:clamp(170px,22vw,260px);aspect-ratio:1;max-width:100%;border:clamp(5px,.6vw,8px) solid var(--seal);color:var(--seal);display:grid;place-items:center;padding:.35em;text-align:center;font-family:var(--font-display);font-weight:700;font-size:clamp(30px,18px + 2.2vw,52px);line-height:1.12;writing-mode:vertical-rl;letter-spacing:.06em;transform:rotate(-4deg);background:rgba(208,80,63,.06);box-shadow:inset 0 0 0 3px rgba(208,80,63,.25);animation:stamp .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:scale(1.6) rotate(-12deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:.8em 0}
.stat{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:.7em .9em}
.stat .v{font-family:var(--font-ui);font-variant-numeric:tabular-nums;font-size:var(--t-prompt);color:var(--gold);font-weight:700}
.stat .k{font-family:var(--font-ui);font-size:var(--t-small);color:var(--mist)}
.result-body{min-width:0;max-width:620px;flex:1 1 320px}
.result-body p{font-size:var(--t-ui);line-height:1.7;color:var(--mist);margin:.3em 0}
.bad-title{font-family:var(--font-display);font-size:clamp(40px,24px + 4vw,96px);color:var(--seal);margin:0;letter-spacing:.1em}

/* toast */
#toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);z-index:70;font-family:var(--font-display);font-size:var(--t-prompt);color:var(--gold);background:rgba(12,14,19,.9);border:1px solid var(--line);border-radius:var(--r);padding:.4em 1em;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{color:var(--seal)}

@media (max-width:640px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .match{grid-template-columns:minmax(0,1fr)}
  .hud-chapter span{display:none}
  #title{justify-content:center;background:linear-gradient(180deg,rgba(8,9,12,.4),rgba(8,9,12,.85))}
  .scroll-title{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function toast(msg, bad){ E.toast.textContent = msg; E.toast.classList.toggle('bad', !!bad); E.toast.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => E.toast.classList.remove('on'), 1600); }

/* ---------- chapter flow ---------- */
function snapshot(){ S.snap = { run:{ ...S.run }, ext:{ ...S.ext }, rec:new Set(S.recorded) }; }

function startRun(fromId){

  gotoChapter(fromId);
}
function gotoChapter(id){
  stopQTE(); closePuzzle(true);
  S.chId = id; S.beat = 0; S.face = MAX_FACE; snapshot();
  const ch = curCh(); S.mode = 'card';
  hideAll(); setHud();

  $('#card-points').innerHTML = ch.points.map(p => `<span>${esc(p)}</span>`).join('');

function beginChapter(){
  if (S.mode !== 'card' || S.lock) return;
  unlockAudio(); AudioFX.play('tap');
  E.card.hidden = true; S.mode = 'play'; runBeat();
}
function restartChapter(){ restoreSnap(); clearStageFx(); gotoChapter(S.chId); }
function next(){ S.beat++; runBeat(); }

async function runBeat(){
  const ch = curCh(); const b = ch && ch.beats[S.beat];
  if (!b) return;
  switch (b.t){
    case 'scene':
      await fadeSwap(() => { clearStageFx(); World.show(b.s, b.shot); if (b.fx) applyFx(b.fx); if (b.s === 'ending') AudioFX.music(true); });
      next(); break;
    case 'say': showSay(b); break;
    case 'mc': case 'order': case 'match': case 'sort': case 'fill': case 'listen': openPuzzle(b); break;
    case 'qteGaze': startGaze(); break;
    case 'qteVolume': startVolume(); break;
    case 'end': chapterEnd(); break;
    case 'results': showResults(); break;
    default: next();
  }
}

$('#btn-sound-2').addEventListener('click', () => { unlockAudio(); toggleSetting('sound'); if (S.settings.sound && S.mode === 'title') AudioFX.music(true); else if (!S.settings.sound) AudioFX.music(false); });
$('#btn-big').addEventListener('click', () => toggleSetting('big'));
$('#btn-full').addEventListener('click', goFull);
$('#btn-full-2').addEventListener('click', goFull);
$('#chk-big').addEventListener('change', e => toggleSetting('big', e.target.checked));
$('#chk-practice').addEventListener('change', e => toggleSetting('practice', e.target.checked));
$('#m-practice').addEventListener('change', e => toggleSetting('practice', e.target.checked));
$('#m-resume').addEventListener('click', closeMenu);
$('#m-restart').addEventListener('click', () => { E.menu.hidden = true; restartChapter(); });
$('#m-select').addEventListener('click', showSelect);
$('#m-title').addEventListener('click', goTitle);
document.addEventListener('pointerdown', unlockAudio, { once:true });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S.mode === 'menu') closeMenu(); else openMenu(); return; }
  if (S.mode === 'menu') return;
  if (S.qte){ if (e.key === ' ' && !e.repeat){ e.preventDefault(); S.qte.key(true); } return; }
  const adv = e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight';
  if (S.mode === 'say' && adv){ e.preventDefault(); advance(); return; }
  if (S.mode === 'card' && adv){ e.preventDefault(); beginChapter(); return; }
  if (S.mode === 'puzzle') puzzleKey(e);
});
document.addEventListener('keyup', e => { if (S.qte && e.key === ' ') S.qte.key(false); });
/* ===== 思維殿堂：選擇、排序、配對、分類、填空、聆聽，以及兩種 QTE ===== */
const KEYS = ['A', 'B', 'C', 'D', 'E', 'F'];
function shuffle(a){ const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function shuffledIdx(n){ let r; do { r = shuffle([...Array(n).keys()]); } while (n > 1 && r.every((v, i) => v === i)); return r; }

function head(b, timer){
  const ext = curCh().kind === 'ext';
  return `<div class="palace-head"><span class="ttl">思維殿堂</span><span class="tag">${esc(b.tag || '')}</span>${ext ? '<span class="tag ext">延伸．不列入段考</span>' : ''}${timer ? '<span class="timer" id="q-timer"></span>' : ''}</div>`;
}
const FB = '<div class="feedback" id="q-fb" hidden></div><div class="actions" id="q-act"></div>';

function openPuzzle(b){
  S.mode = 'puzzle'; S.q = { b, wrong:0, done:false, timer:0 };
  const dock = b.t === 'listen';
  E.palace.classList.toggle('dock', dock);
  if (!dock) E.stage.classList.add('palace');
  World.palace(true, dock ? null : b.glyph); AudioFX.play('chime');
  ({ mc:renderMC, order:renderOrder, match:renderMatch, sort:renderSort, fill:renderFill, listen:renderListen })[b.t](b);
  E.palace.hidden = false; E.pcard.scrollTop = 0;
  setTimeout(() => { const f = E.pcard.querySelector('.opt,.card,.chip,.tile,.btn'); f && f.focus({ preventScroll:true }); }, 80);
}
function closePuzzle(silent){
  if (S.q && S.q.timer) clearInterval(S.q.timer);
  if (S.q && S.q.later) S.q.later.forEach(clearTimeout);
  S.q = null; E.palace.hidden = true; E.palace.classList.remove('dock'); E.stage.classList.remove('palace');
  if (!silent || World.ok) World.palace(false);
}
function feedback(ok, text, extra){
  const fb = $('#q-fb'); if (!fb) return;
  fb.hidden = false; fb.className = 'feedback ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `<div class="fb-h">${ok ? '答對了．解析' : (S.settings.practice ? '再想一想' : '答錯了．體面 −1')}</div>${extra || ''}<p>${esc(text)}</p>`;
}
function fail(text, extra){
  if (!S.q) return true;
  S.q.wrong++; AudioFX.play('wrong'); feedback(false, text, extra);
  if (loseFace()){ const q = S.q; q.done = true; setTimeout(() => { if (S.q === q) badEnd(); }, 1100); return true; }
  return false;
}
function solved(){
  const q = S.q; if (!q || q.done) return; q.done = true;
  if (q.timer) clearInterval(q.timer);
  AudioFX.play('correct'); record(q.b, q.wrong === 0);
  feedback(true, q.b.ex, q.b.skill ? `<div class="skill">${esc(q.b.skill)}</div>` : '');
  if (q.b.solvedEv) World.ev(q.b.solvedEv);
  const act = $('#q-act'); act.innerHTML = '<button class="btn primary" id="q-next">繼續</button>';
  const btn = $('#q-next'); btn.addEventListener('click', () => { closePuzzle(); S.mode = 'play'; next(); });
  setTimeout(() => btn.focus({ preventScroll:true }), 60);
  btn.scrollIntoView({ block:'nearest', behavior:reduceMotion ? 'auto' : 'smooth' });
}
function puzzleKey(e){
  const q = S.q; if (!q) return;
  if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && q.done){ const n = $('#q-next'); if (n){ e.preventDefault(); n.click(); } return; }
  if (q.b.t === 'mc' || (q.b.t === 'listen' && q.mcReady)){
    let i = '1234'.indexOf(e.key); if (i < 0) i = 'abcd'.indexOf(e.key.toLowerCase());
    const btn = i >= 0 && E.pcard.querySelector(`.opt[data-i="${i}"]`);
    if (btn){ e.preventDefault(); btn.click(); }
  }
}

/* ---------- 選擇題 ---------- */
function optsHTML(b, opts){
  const long = b.one || opts.some(o => o.length > 13);
  return `<div class="opts ${long ? 'one' : ''}">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span class="${b.zy ? 'zy' : ''}">${esc(o)}</span></button>`).join('')}</div>`;
}
function bindOpts(b, answer, wrongText){
  E.pcard.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
    const q = S.q; if (!q || q.done || btn.disabled) return;
    const i = +btn.dataset.i;
    if (i === answer){ btn.classList.add('correct'); E.pcard.querySelectorAll('.opt').forEach(x => x.disabled = true); solved(); }
    else {
      btn.classList.add('wrong'); btn.disabled = true;
      const branch = b.wrongFb && b.wrongFb[i];
      fail(wrongText ? wrongText(i) : '這個選項不對，看看其他答案。', branch ? `<p class="branch">${esc(branch)}</p>` : '');
    }
  }));
}
function renderMC(b){
  E.pcard.innerHTML = head(b) + `<p class="prompt">${esc(b.prompt)}</p>` + (b.quote ? `<div class="quote">${esc(b.quote)}</div>` : '') + optsHTML(b, b.opts) + FB;
  bindOpts(b, b.a);
}

/* ---------- 排序 ---------- */
function renderOrder(b){
  const q = S.q, n = b.items.length, disp = shuffledIdx(n); q.seq = [];
  E.pcard.innerHTML = head(b, !!b.timer) + `<p class="prompt">${esc(b.prompt)}</p><p class="cue" style="color:var(--mist);font-size:var(--t-small)">依序點選每一張卡片；點已編號的卡片可以取消。</p>
    <div class="cards">${disp.map(i => `<button class="card" data-i="${i}"><span class="num"></span>${esc(b.items[i])}</button>`).join('')}</div>` + FB;
  const act = $('#q-act'); act.innerHTML = '<button class="btn" id="q-clear">全部清除</button><button class="btn primary" id="q-check" disabled>確認順序</button>';
  const cards = [...E.pcard.querySelectorAll('.card')];
  const paint = () => {
    cards.forEach(c => { const i = +c.dataset.i, p = q.seq.indexOf(i); c.classList.toggle('on', p >= 0); c.querySelector('.num').textContent = p >= 0 ? p + 1 : ''; c.classList.remove('bad'); });
    $('#q-check').disabled = q.seq.length !== n;
  };
  cards.forEach(c => c.addEventListener('click', () => {
    if (q.done) return; const i = +c.dataset.i; AudioFX.play('tap');
    q.seq = q.seq.includes(i) ? q.seq.filter(x => x !== i) : q.seq.concat(i); paint();
  }));
  $('#q-clear').addEventListener('click', () => { if (!q.done){ q.seq = []; paint(); } });
  $('#q-check').addEventListener('click', () => {
    if (q.done) return;
    const p = q.seq.findIndex((v, j) => v !== j);
    if (p < 0){ cards.forEach(c => c.classList.add('good')); $('#q-check').disabled = true; $('#q-clear').disabled = true; act.innerHTML = ''; solved(); return; }
    const wrongCards = q.seq.slice(p);
    q.seq = q.seq.slice(0, p); paint();
    cards.forEach(c => { if (wrongCards.includes(+c.dataset.i)) c.classList.add('bad'); });
    fail(p === 0 ? '第一步就不對。想想故事是從哪裡開始的？' : `前 ${p} 步是對的，已經保留；從第 ${p + 1} 步開始重新排。`);
  });
  if (b.timer){
    let left = b.timer; const tEl = $('#q-timer');
    const tick = () => { if (S.mode === 'menu') return; tEl.textContent = `封門倒數 ${left} 秒`; if (left-- <= 0){ if (q.done) return; q.seq = []; paint(); left = b.timer; fail('時間到，封門了！再試一次。'); } };
    tick(); q.timer = setInterval(() => { if (!q.done) tick(); }, 1000);
  }
}

/* ---------- 配對 ---------- */
function renderMatch(b){
  const q = S.q, n = b.left.length, disp = shuffledIdx(n); q.sel = null; q.matched = new Set();
  E.pcard.innerHTML = head(b) + `<p class="prompt">${esc(b.prompt)}</p>` +
    (b.boss ? `<div class="boss"><span>${esc(b.boss)}</span><div class="bar"><i id="q-hp" style="width:100%"></i></div></div>` : '') +
    `<div class="match"><div class="col"><div class="col-h">${esc(b.lh || '詞語')}</div>${b.left.map((t, i) => `<button class="card" data-l="${i}">${esc(t)}</button>`).join('')}</div>
     <div class="col"><div class="col-h">${esc(b.rh || '意思')}</div>${disp.map(j => `<button class="card" data-r="${j}">${esc(b.right[j])}</button>`).join('')}</div></div>` + FB;
  const L = [...E.pcard.querySelectorAll('[data-l]')], R = [...E.pcard.querySelectorAll('[data-r]')];
  L.forEach(c => c.addEventListener('click', () => {
    if (q.done) return; const i = +c.dataset.l; if (q.matched.has(i)) return;
    q.sel = i; AudioFX.play('tap'); L.forEach(x => x.classList.toggle('sel', x === c));
  }));
  R.forEach(c => c.addEventListener('click', () => {
    if (q.done) return; const j = +c.dataset.r; if (q.matched.has(j) && c.classList.contains('done')) return;
    if (q.sel == null){ toast('先點左邊一張，再點右邊配對'); return; }
    const i = q.sel, lc = L[i];
    if (i === j){
      q.matched.add(i); const no = q.matched.size;
      [lc, c].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.insertAdjacentHTML('afterbegin', `<span class="pair">${no}</span>`); });
      q.sel = null;
      const hp = 1 - q.matched.size / n;
      if (b.boss){ $('#q-hp').style.width = (hp * 100) + '%'; AudioFX.play('drum'); World.ev('hit', hp); }
      else AudioFX.play('tap');
      if (b.pairEv) World.ev(b.pairEv, hp);
      const fb = $('#q-fb'); if (fb) fb.hidden = true;
      if (q.matched.size === n) solved();
    } else {
      [lc, c].forEach(x => { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 450); });
      lc.classList.remove('sel'); q.sel = null;
      fail(`「${b.left[i]}」配「${b.right[j]}」不對，再試一次。`);
    }
  }));
}

/* ---------- 分類 ---------- */
function renderSort(b){
  const q = S.q, disp = shuffledIdx(b.items.length); q.assign = {};
  E.pcard.innerHTML = head(b) + `<p class="prompt">${esc(b.prompt)}</p><div class="sort-list">${disp.map(i => `<div class="sort-row" data-i="${i}"><span class="txt">${esc(b.items[i].x)}</span><span class="chips">${b.bins.map((bn, k) => `<button class="chip" data-k="${k}" aria-pressed="false">${esc(bn)}</button>`).join('')}</span></div>`).join('')}</div>` + FB;
  const act = $('#q-act'); act.innerHTML = '<button class="btn primary" id="q-check" disabled>確認</button>';
  const rows = [...E.pcard.querySelectorAll('.sort-row')];
  const paint = () => { rows.forEach(r => { const i = +r.dataset.i; r.querySelectorAll('.chip').forEach(ch => ch.setAttribute('aria-pressed', String(q.assign[i] === +ch.dataset.k))); }); $('#q-check').disabled = Object.keys(q.assign).length !== b.items.length; };
  rows.forEach(r => r.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => { if (q.done) return; q.assign[+r.dataset.i] = +ch.dataset.k; r.classList.remove('bad'); AudioFX.play('tap'); paint(); })));
  $('#q-check').addEventListener('click', () => {
    if (q.done) return;
    const wrong = rows.filter(r => q.assign[+r.dataset.i] !== b.items[+r.dataset.i].b);
    if (!wrong.length){ rows.forEach(r => r.classList.add('good')); act.innerHTML = ''; solved(); return; }
    wrong.forEach(r => { delete q.assign[+r.dataset.i]; r.classList.add('bad'); }); paint();
    fail(`有 ${wrong.length} 句放錯了，已經清空，請重新選。`);
  });
}

/* ---------- 選詞填空 ---------- */
function renderFill(b){
  const q = S.q, nSlots = b.answer.length, bank = shuffle(b.bank.map((t, i) => ({ t, i })));
  q.slots = Array(nSlots).fill(null);
  const phrase = p => p.map(x => typeof x === 'number' ? `<button class="slot" data-s="${x}" aria-label="空格 ${x + 1}">　</button>` : esc(x)).join('');
  E.pcard.innerHTML = head(b) + `<p class="prompt">${esc(b.prompt)}</p><div class="phrases">${b.phrases.map(p => `<div class="phrase">${phrase(p)}</div>`).join('')}</div>
    <div class="bank">${bank.map(o => `<button class="tile" data-t="${o.i}">${esc(o.t)}</button>`).join('')}</div>` + FB;
  const act = $('#q-act'); act.innerHTML = '<button class="btn primary" id="q-check" disabled>確認</button>';
  const slots = [...E.pcard.querySelectorAll('.slot')], tiles = [...E.pcard.querySelectorAll('.tile')];
  const paint = () => {
    slots.forEach(s => { const k = +s.dataset.s, v = q.slots[k]; s.textContent = v == null ? '　' : b.bank[v]; });
    tiles.forEach(t => t.disabled = q.slots.includes(+t.dataset.t));
    $('#q-check').disabled = q.slots.some(v => v == null);
  };
  tiles.forEach(t => t.addEventListener('click', () => { if (q.done || t.disabled) return; const k = q.slots.indexOf(null); if (k < 0) return; q.slots[k] = +t.dataset.t; AudioFX.play('tap'); slots.forEach(s => s.classList.remove('bad')); paint(); }));
  slots.forEach(s => s.addEventListener('click', () => { if (q.done) return; q.slots[+s.dataset.s] = null; s.classList.remove('bad'); paint(); }));
  $('#q-check').addEventListener('click', () => {
    if (q.done) return;
    const val = q.slots.map(v => b.bank[v]), ok = val.map((v, k) => v === b.answer[k]);
    (b.swap || []).forEach(([x, y]) => { if (val[x] === b.answer[y] && val[y] === b.answer[x]){ ok[x] = ok[y] = true; } });
    if (ok.every(Boolean)){ slots.forEach(s => s.classList.add('good')); act.innerHTML = ''; solved(); return; }
    ok.forEach((g, k) => { if (!g){ q.slots[k] = null; slots[k].classList.add('bad'); } });
    paint(); fail(`有 ${ok.filter(g => !g).length} 個空格不對，已經退回，請再選一次。`);
  });
}

/* ---------- 聆聽推理（延伸二） ---------- */
function renderListen(b){
  const q = S.q, which = Math.random() < .5 ? 'front' : 'back', ans = which === 'front' ? 1 : 0;
  q.later = [];
  E.pcard.innerHTML = head(b) + `<p class="prompt">天亮了，母親輕輕地哭著……仔細聽，是哪一扇房門開了？</p>
    <p class="cue" id="q-cue">按下「聆聽」，注意宅院裡哪扇門亮起來。</p><div id="q-mc"></div>` + FB;
  const act = $('#q-act'); act.innerHTML = '<button class="btn primary" id="q-listen">聆聽</button>';
  $('#q-listen').addEventListener('click', () => {
    $('#q-listen').disabled = true; AudioFX.play('creak'); World.ev('door', which);
    $('#q-cue').textContent = which === 'front' ? '前堂東房的門，吱呀一聲開了。' : '後堂西房的門，吱呀一聲開了。';
    q.later.push(setTimeout(() => { if (S.q !== q) return; $('#q-cue').textContent += '一位嫂子走進廚房，捧著一碗熱茶，來敲母親的房門。'; }, 2600));
    q.later.push(setTimeout(() => {
      if (S.q !== q) return; act.innerHTML = '';
      $('#q-mc').innerHTML = `<p class="prompt" style="font-size:var(--t-option)">這十天半個月來鬧氣的，是哪一位嫂子？</p>` + optsHTML({ one:false }, ['大嫂', '二嫂', '兩位都有', '無法判斷']);
      q.b = Object.assign({}, b, { ex:`端熱茶進來的，總是那個鬧氣的嫂子。${which === 'front' ? '開門的是前堂東房，住的是二嫂。' : '開門的是後堂西房，住的是大嫂。'}` });
      q.mcReady = true;
      bindOpts(q.b, ans, () => '想想看：開門的房間住的是誰？誰才會端茶來和解？');
      const f = E.pcard.querySelector('.opt'); f && f.focus({ preventScroll:true });
    }, 4200));
  });
}

/* ---------- QTE：嚴厲眼光 ---------- */
const EYE = '<svg viewBox="0 0 48 28" aria-hidden="true"><path d="M2 14C10 3 38 3 46 14C38 25 10 25 2 14Z"/><circle cx="24" cy="14" r="6"/></svg>';
function qtePanel(title, html){
  S.mode = 'puzzle'; E.palace.classList.add('dock'); E.palace.hidden = false;
  E.pcard.innerHTML = `<div class="palace-head"><span class="ttl">${esc(title)}</span><span class="tag">互動</span></div>${html}`;
}
function startGaze(){
  World.shot('wide', 1.2);
  qtePanel('嚴厲眼光', `<div class="qte" id="qte"><div class="qte-info"><p class="prompt" style="font-size:var(--t-option)">按住「玩陀螺」讓小胡適玩耍；母親的目光一轉過來，就立刻放手！集滿開心值就過關。</p>
    <div class="eye" id="eye">${EYE}<span id="eye-t">母親正在忙</span></div>
    <div class="meter"><i id="qte-m"></i></div><div class="status" id="qte-s"></div></div>
    <button class="big" id="qte-btn">按住<br>玩陀螺</button></div>`);
  const btn = $('#qte-btn'), m = $('#qte-m'), eye = $('#eye'), eyeT = $('#eye-t'), st = $('#qte-s'), box = $('#qte');
  const Q = S.qte = { kind:'gaze', hold:false, meter:0, phase:'idle', t:0, nextAt:1.6 + Math.random() * 1.2, caught:false, paused:false, last:performance.now(), raf:0 };
  const setHold = v => { if (Q.done) return; Q.hold = v; btn.classList.toggle('down', v); if (v) unlockAudio(); };
  Q.key = setHold;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture && btn.setPointerCapture(e.pointerId); setHold(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => btn.addEventListener(n, () => setHold(false)));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  const loop = now => {
    if (S.qte !== Q) return; Q.raf = requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - Q.last) / 1000); Q.last = now; if (Q.paused || Q.done) return;
    Q.t += dt;
    if (Q.phase === 'idle' && Q.t >= Q.nextAt){ Q.phase = 'warn'; Q.t = 0; eye.className = 'eye warn'; eyeT.textContent = '母親轉過頭來了……'; World.ev('gaze', true); AudioFX.play('gaze'); }
    else if (Q.phase === 'warn' && Q.t >= .6){ Q.phase = 'gaze'; Q.t = 0; Q.caught = false; eye.className = 'eye on'; eyeT.textContent = '母親正看著你！'; }
    else if (Q.phase === 'gaze'){
      if (Q.hold && Q.t > .35 && !Q.caught){
        Q.caught = true; Q.meter = Math.max(0, Q.meter - .25); st.textContent = '被母親看見了！'; AudioFX.play('wrong');
        box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
        if (loseFace()){ Q.done = true; setTimeout(badEnd, 900); return; }
      }
      if (Q.t >= 1.4){ Q.phase = 'idle'; Q.t = 0; Q.nextAt = 1.4 + Math.random() * 1.6; eye.className = 'eye'; eyeT.textContent = '母親正在忙'; World.ev('gaze', false); if (!Q.caught) st.textContent = '好險，沒被發現。'; }
    }
    World.ev('play', Q.hold && Q.phase !== 'gaze');
    if (Q.hold && Q.phase !== 'gaze'){ Q.meter = Math.min(1, Q.meter + dt * .21); }
    m.style.width = (Q.meter * 100) + '%';
    if (Q.meter >= 1){ Q.done = true; World.ev('play', false); World.ev('gaze', false); st.textContent = '你學會看母親的眼色了。'; AudioFX.play('correct'); setTimeout(() => { if (S.qte === Q){ stopQTE(); S.mode = 'play'; next(); } }, 1400); }
  };
  Q.raf = requestAnimationFrame(loop);
}

/* ---------- QTE：忍住哭聲 ---------- */
function startVolume(){
  World.shot('kneel', 1.5);
  qtePanel('忍住哭聲', `<div class="qte" id="qte"><div class="qte-info"><p class="prompt" style="font-size:var(--t-option)">一直點「忍住」，別讓哭聲越過紅線，撐過 8 秒。</p>
    <div class="status" id="qte-left"></div>
    <div class="meter cry"><i id="qte-m"></i><span class="redline"></span></div><div class="status" id="qte-s"></div></div>
    <button class="big" id="qte-btn">忍住</button></div>`);
  const btn = $('#qte-btn'), m = $('#qte-m'), st = $('#qte-s'), left = $('#qte-left'), box = $('#qte');
  const Q = S.qte = { kind:'vol', level:.3, time:8, sob:1.2, paused:false, last:performance.now(), raf:0 };
  const press = () => { if (Q.done) return; unlockAudio(); Q.level = Math.max(0, Q.level - .085); btn.classList.add('down'); setTimeout(() => btn.classList.remove('down'), 90); };
  Q.key = v => { if (v) press(); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  const loop = now => {
    if (S.qte !== Q) return; Q.raf = requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - Q.last) / 1000); Q.last = now; if (Q.paused || Q.done) return;
    Q.time -= dt; Q.sob -= dt; Q.level += dt * .2;
    if (Q.sob <= 0){ Q.level += .1 + Math.random() * .08; Q.sob = .9 + Math.random() * .8; }
    if (Q.level >= .85){
      Q.level = .45; st.textContent = '哭出聲了！母親的臉色更沉了。'; AudioFX.play('wrong');
      box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
      if (loseFace()){ Q.done = true; setTimeout(badEnd, 900); return; }
    }
    m.style.width = (Math.min(1, Q.level) * 100) + '%';
    left.textContent = `還要撐 ${Math.max(0, Q.time).toFixed(1)} 秒`;
    if (Q.time <= 0){ Q.done = true; left.textContent = ''; st.textContent = '你咬著牙，一聲也沒哭出來。'; AudioFX.play('correct'); setTimeout(() => { if (S.qte === Q){ stopQTE(); S.mode = 'play'; next(); } }, 1400); }
  };
  Q.raf = requestAnimationFrame(loop);
}
function stopQTE(){
  if (!S.qte) return; cancelAnimationFrame(S.qte.raf); S.qte = null;
  E.palace.hidden = true; E.palace.classList.remove('dock');
  World.ev('play', false);
}

/* ---------- 啟動 ---------- */
(function boot(){
  applySettings();
  const ok = World.init(E.stage);
  if (!ok) document.getElementById('fallback').classList.add('on');
  const start = data => {
    goTitle();
    if (data && data.chId && chById(data.chId)){ S.run = data.run || newStats(); S.ext = data.ext || newStats(); S.partial = !!data.partial; S.recorded = new Set(data.rec || []); gotoChapter(data.chId); }
  };
  window.claude?.hot?.snapshot?.(() => ({ chId:S.mode === 'title' || S.mode === 'select' ? null : S.chId, run:S.run, ext:S.ext, partial:S.partial, rec:[...S.recorded] }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
